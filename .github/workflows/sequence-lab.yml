name: Sequence Lab

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "configs/**"
      - ".github/workflows/sequence-lab.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sequence-lab
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run anonymous research batch
        run: python src/runner.py

      - name: Commit result checkpoint
        shell: bash
        run: |
          git config user.name "sequence-lab-bot"
          git config user.email "sequence-lab-bot@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "chore: update experiment checkpoint"
            git push
          fi

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: sequence-lab-results
          path: |
            results/latest.json
            results/failure_report.json
          retention-days: 1
